services:
  daily-github:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-github
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "18080:18080"
      - "18081:18081"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s